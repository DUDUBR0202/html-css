<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio de tabela</title>
    <style>
         body{
        font-family: Arial, Helvetica, sans-serif;}

        table{
        border-collapse: collapse;
        width: 500px;
     }
        caption{
            font-size: 1.3em;
            font-weight: bolder;
            padding: 8px;
        }
        
        th, td{
            border: 1px solid black;
            padding: 6px;
        
        }
        tr.destaque{
            background-color:rgb(240, 101, 143);
        }
        .cnome, .cidade{
            background-color: greenyellow;
        }

    </style>
</head>
<body>
    <h1>Exercicio de tabela</h1>
    <table>
        <caption>Cadastro</caption>
        <colgroup>
            <col class="cnome">
            <col class="csexo">
            <col class="cidade">
            <col class="cprof">
        </colgroup>
        <caption>
            <tr>
                <th scope="col">Nome</th>
                <th scope="col">Sexo</th>
                <th scope="col">Idade</th>
                <th scope="col">Profissão<th>
            </tr>
            <tr>
                <td>Ana maria</td>
                <td>F</td>
                <td>25</td>
                <td>Jornalista</td>
            </tr>
            <tr class="destaque">
                <td>Eduardo</td>
                <td>M</td>
                <td>23</td>
                <td>Empresario</td>
            </tr>
            <tr>
                <td>Josi</td>
                <td>F</td>
                <td>26</td>
                <td>Nutricionista</td>
            </tr>
            <tr class="destaque">
                <td>Alberto</td>
                <td>M</td>
                <td>24</td>
                <td>MicroEmpresario</td>
            </tr>
            <tr>
                <td>Cristina</td>
                <td>F</td>
                <td>63</td>
                <td>Aposentada</td>
            </tr>
            <tr>
                <td>Carlos</td>
                <td>M</td>
                <td>65</td>
                <td>Farmaceutico</td>
            </tr>
            </table>
        </caption>
</body>
</html>
