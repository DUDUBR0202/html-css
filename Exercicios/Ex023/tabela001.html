<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha primeira tabela</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        
        }
        table{
            width: 400px;
            height: 400px;
            border-collapse: collapse;

        }
        tr.projeto{
            background-color:gray;
        }

        td.b{
            background-color: yellow;
        }

        td {
            border: 1px solid black;
            padding: 8px;
            text-align: center;
            
        }

        tr.Z{
            background-color: red;
        }

    </style>
</head>
<body>
    <h1>Minha primeira tabela</h1>
    <!--Hierarquia de tabela(simples)
    TABLE = tabela
     TABLE ROW = linha de tabela
      TABLE HEADER = cabeçalho de tabela
      TABLE DATA = dado de tabela
    -->
      <table>
        <tr> <!--Primeira linha-->
            <td class="b">A1</td>
            <td>B1</td>
            <td>C1</td> 
        </tr>
        <tr class="projeto">
            <td>A2</td>
            <td>B2</td>
            <td>C2</td>
        </tr>
                <tr>
            <td>A3</td>
            <td>B3</td>
            <td>C3</td>
        </tr>
                <tr>
            <td>A4</td>
            <td class="b">B4</td>
            <td>C4</td>
        </tr>

      </table>
          <h1>Segunda tabela</h1>
          <table>
    <tr>
        <td class="b">X1</td>
        <td>X2</td>
        <td>x3</td>
    </tr>
    <tr class="Z">
        <td>Z1</td>
        <td>Z2</td>

    </tr>
    <tr>
        <td class="b">Y1</td>

        <td>Y3</td>
    </tr>
    </table>
</body>
</html>
